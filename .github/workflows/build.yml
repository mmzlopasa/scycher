name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SCYCHER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SCYCHER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/scycher.jks"
            {
              echo "storeFile=$RUNNER_TEMP/scycher.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=scycher"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secret – APK will be debug-signed"
          fi

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; else NAME="1.0.${{ github.run_number }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ steps.v.outputs.name }} --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Scycher-${{ steps.v.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Scycher-${{ steps.v.outputs.name }}
          path: Scycher-*.apk

      - name: Publish release
        # Only publish properly signed builds so updates install over each other
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: Scycher-*.apk
          generate_release_notes: true
